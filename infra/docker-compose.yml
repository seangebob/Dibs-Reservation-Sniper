# Local infrastructure for Milestone 3.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Redis is both the Celery broker and the watch store. PostgreSQL is here now
# so Milestone 4 has somewhere to persist user-owned reservations; nothing in
# the backend connects to it yet.

services:
  redis:
    image: redis:7-alpine
    container_name: dibs-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: dibs-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dibs
      POSTGRES_PASSWORD: dibs
      POSTGRES_DB: dibs
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dibs"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Application services live behind the "app" profile so the default
  # `docker compose up` still starts ONLY redis + postgres. Start them with:
  #   docker compose --profile app up
  # Both build the same root image; the worker just overrides the command.
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dibs-api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dibs-worker
    command: celery -A backend.workers.celery_app worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
