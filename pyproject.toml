[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dibs-backend"
version = "0.3.0"
description = "AI orchestration backend for KW venue reservations"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "openai==3.2.0",
    "pydantic==2.13.4",
    "tzdata==2026.3",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
