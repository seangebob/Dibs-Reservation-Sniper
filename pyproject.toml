[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dibs-backend"
version = "0.4.0"
description = "AI orchestration backend for KW venue reservations"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "asyncpg==0.30.0",
    "fastapi==0.141.1",
    "openai==3.2.0",
    "pydantic==2.13.4",
    "redis==7.4.1",
    "tzdata==2026.3",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
# Celery is only needed to run the background worker process. The API
# dispatches through the TaskQueue protocol and never imports it.
worker = [
    "celery==5.6.3",
]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Executes the exact production Lua for the atomic watch repository in
    # tests, so Redis atomicity is proven against real script semantics rather
    # than a hand-written fake. The [lua] extra pulls in lupa.
    "fakeredis[lua]==2.37.1",
]
dev = [
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
